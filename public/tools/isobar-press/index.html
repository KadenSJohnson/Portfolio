<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isobar Press</title>
<meta name="description" content="Make contour maps, air-current charts, arrow fields and stacked relief graphics with a riso-print look. Export PNG or layered SVG.">
<meta name="theme-color" content="#21403a">
<meta property="og:type" content="website">
<meta property="og:title" content="Isobar Press">
<meta property="og:description" content="Make contour maps, air-current charts, arrow fields and stacked relief graphics with a riso-print look.">
<meta property="og:image" content="https://kadenjohnson.me/tools/isobar-press/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2321403a'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23eef3ea' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff6b3d'/%3E%3C/svg%3E">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Narrow:wght@500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen light table. The print sits on a green cutting mat; tools dock at the bottom, the full control set lives in a sheet behind the gear. */
:root{
  --mat:#21403a; --mat-line:#294b43; --btn:#2c4c44; --line:#406259;
  --text:#eef3ea; --muted:#9fb8ad; --accent:#ff6b3d;
  --chip:#e9ece3; --chip-ink:#14211d; --panel:#16291f; --panel-2:#1d3329;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-data:"Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --i0:#1c1b19; --i1:#ff4a2c; --i2:#2f5fd0; --i3:#159a62; --i4:#ff8fc6; --paper:#e2ec2a;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mat);color:var(--text);font-family:var(--f-ui);overflow:hidden;
  background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:28px 28px;background-position:center}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:6px;padding-block:10px 4px}
.brand{margin-right:auto;display:flex;align-items:center;gap:10px;font-family:var(--f-display);
  font-variation-settings:"wdth" 125;font-weight:800;font-size:15px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.brand b{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--text);position:relative}
.brand b::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--btn);display:grid;place-items:center}
.ibtn:active{transform:translateY(1px)}

.stage{position:relative;min-height:0;display:grid;place-items:center;padding-block:8px}
.sheet{position:relative;box-shadow:0 1px 0 rgba(0,0,0,.25),0 22px 44px -16px rgba(0,0,0,.6);max-width:100%}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}

.selbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;
  background:var(--chip);color:var(--chip-ink);border-radius:16px;padding:4px;box-shadow:0 10px 26px -8px rgba(0,0,0,.55);max-width:calc(100% - 8px)}
.selbar button{width:42px;height:42px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center}
.selbar button:active{background:rgba(0,0,0,.08)}
.selbar .danger{color:#c4361b}
.selbar input{height:40px;border:1.5px solid var(--chip-ink);border-radius:10px;padding:0 10px;width:min(200px,52vw);
  background:#fff;color:var(--chip-ink);font-family:"Oswald",var(--f-data);font-size:16px;text-transform:uppercase;letter-spacing:.02em}

.dock{display:grid;gap:8px;padding-block:4px 12px;max-width:620px;width:100%;justify-self:center}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--btn);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{height:38px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tools button{height:52px;border:1px solid var(--line);border-radius:14px;background:var(--btn);display:grid;place-items:center;align-content:center;gap:2px;
  font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding:0}
.tools button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1a0d06}

/* settings sheet */
.panel{position:fixed;left:0;right:0;bottom:0;height:54%;max-height:none;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -18px 40px -10px rgba(0,0,0,.5);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.phead{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.phead h2{margin:0 auto 0 0;font-family:var(--f-display);font-variation-settings:"wdth" 118;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pbody{overflow:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
@media (min-width:900px){
  .panel{left:auto;top:0;width:360px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
}
.psec{padding-block:14px 6px;border-bottom:1px solid var(--panel-2)}
.hmrow{padding-block:6px 4px}
.modebar{position:sticky;top:0;z-index:2;background:var(--panel);padding-block:12px 10px;border-bottom:1px solid var(--panel-2)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.sbody{padding-bottom:4px}
.psec h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;min-height:40px}
.prow label,.prow .lab{font-size:13.5px;color:var(--text)}
.prow output{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.prow.range input{grid-column:1/-1;margin-top:-6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--chip);margin-top:-9px;border:3px solid var(--panel)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--chip);border:3px solid var(--panel)}
.tg{width:50px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--panel-2);position:relative}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tg[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tg[aria-checked="true"]::after{transform:translateX(20px);background:#1a0d06}
.prow select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding:0 8px;min-width:130px}
.inks{display:flex;gap:2px}
.inks button{width:36px;height:40px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px}
.inks span{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.inks button[aria-pressed="true"] span{border-color:var(--text);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--text)}
.inks .off span{background:linear-gradient(135deg,transparent 45%,var(--muted) 45% 55%,transparent 55%);border-color:var(--muted)}
.pal-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--panel-2);text-align:left}
.pcard .sw{height:40px;display:flex;align-items:flex-end;gap:4px;padding:6px 8px}
.pcard .sw i{width:12px;height:12px;border-radius:50%;display:block}
.pcard em{display:block;font-style:normal;font-size:12px;font-weight:600;padding:6px 8px}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pal-colors{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.pal-colors label{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);font-family:var(--f-data)}
.pal-colors input{width:40px;height:40px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.pal-colors input::-webkit-color-swatch-wrapper{padding:0}
.pal-colors input::-webkit-color-swatch{border:2px solid rgba(255,255,255,.2);border-radius:50%}
.pal-colors input::-moz-color-swatch{border:2px solid rgba(255,255,255,.2);border-radius:50%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;font-weight:600}

/* setup */
.setup{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(14,28,23,.72);backdrop-filter:blur(3px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scard{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:18px}
.scard h2{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.sfield{display:grid;gap:8px}
.sfield>span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#oTerrain{grid-template-columns:repeat(2,1fr)}
.opts.presets{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.ochip{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;gap:4px;padding:6px 4px;font-size:12px;font-weight:600}
.ochip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--text)}
.ochip .shape{border:1.5px solid currentColor;border-radius:2px}
.sact{display:flex;gap:10px;justify-content:flex-end}
.primary{height:46px;padding:0 22px;border-radius:14px;border:0;background:var(--accent);color:#1a0d06;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.ghost{height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600}

.export{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.94);display:grid;place-items:center;padding:56px 16px 16px}
.export img{max-width:100%;max-height:100%;box-shadow:0 20px 40px -10px #000}
.export .ibtn{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.xmenu{position:fixed;z-index:25;top:calc(58px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:4px;padding:4px;
  background:var(--chip);border-radius:14px;box-shadow:0 10px 26px -8px rgba(0,0,0,.55)}
.xmenu button{height:42px;min-width:110px;border:0;border-radius:10px;background:transparent;color:var(--chip-ink);font-weight:700;letter-spacing:.06em;text-align:left;padding:0 14px}
.xmenu button:active{background:rgba(0,0,0,.08)}
.excopy{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--chip);color:var(--chip-ink);border:0}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;background:var(--chip);color:var(--chip-ink);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
@media (max-width:540px){.brand span{display:none}}
.ibtn:disabled{opacity:.35;cursor:default}
#bRedo{margin-right:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b></b><span>Isobar Press</span></div>
    <button class="ibtn" id="bUndo" aria-label="Undo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ibtn" id="bRedo" aria-label="Redo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="ibtn" id="bShuffle" aria-label="Shuffle"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h4M17 14l3 3-3 3M3 17h3c1.5 0 2.7-1.4 3.8-3M13.2 10c1.1-1.6 2.3-3 3.8-3h3M17 4l3 3-3 3"/></svg></button>
    <button class="ibtn" id="bNew" aria-label="New sheet"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 9v6M9 12h6"/></svg></button>
    <button class="ibtn" id="bExport" aria-label="Export PNG"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button class="ibtn" id="bSettings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg></button>
  </header>

  <main class="stage" id="stage">
    <div class="sheet" id="sheet"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
    <div class="selbar" id="selbar" hidden></div>
  </main>

  <footer class="dock">
    <div class="tools" id="tools"></div>
  </footer>
</div>

<aside class="panel" id="panel" hidden>
  <div class="phead"><h2>Settings</h2><button class="ibtn" id="bClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pbody" id="pbody"></div>
</aside>

<div class="setup" id="setup" hidden>
  <div class="scard">
    <h2>New sheet</h2>
    <div class="sfield"><span>Size</span><div class="opts" id="oSize"></div></div>
    <div class="sfield"><span>Ink set</span><div class="opts presets" id="oPreset"></div></div>
    <div class="sfield"><span>Start with</span><div class="opts" id="oRecipe"></div></div>
    <div class="sfield"><span>Terrain</span><div class="opts" id="oTerrain"><button class="ochip" data-k="random" aria-pressed="true">Random</button><button class="ochip" data-k="image" aria-pressed="false">Heightmap</button><input type="file" id="fSetupHm" accept="image/*" hidden></div></div>
    <div class="sact"><button class="ghost" id="sCancel">Cancel</button><button class="primary" id="sGo">Start sheet</button></div>
  </div>
</div>

<div class="export" id="exportView" hidden><button class="ibtn" id="exClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img id="exImg" alt="Exported sheet"><button class="tbtn excopy" id="exCopy" hidden>Copy SVG</button></div>
<div class="xmenu" id="xmenu" hidden><button id="xPng">PNG</button><button id="xSvg">SVG</button></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const KEY='isobar-press:v1';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(seed){
  const r=mulberry32(seed),perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  const p=new Uint8Array(512);for(let i=0;i<512;i++)p[i]=perm[i&255];
  const gx=new Float32Array(256),gy=new Float32Array(256);for(let i=0;i<256;i++){const a=r()*TAU;gx[i]=Math.cos(a);gy[i]=Math.sin(a)}
  return (x,y)=>{const X=Math.floor(x),Y=Math.floor(y),xf=x-X,yf=y-Y,xi=X&255,yi=Y&255;
    const g=(ix,iy,dx,dy)=>{const h=p[p[ix]+iy];return gx[h]*dx+gy[h]*dy};
    const u=xf*xf*xf*(xf*(xf*6-15)+10),v=yf*yf*yf*(yf*(yf*6-15)+10);
    const a=g(xi,yi,xf,yf),b=g(xi+1,yi,xf-1,yf),c=g(xi,yi+1,xf,yf-1),d=g(xi+1,yi+1,xf-1,yf-1);
    return ((a+(b-a)*u)+((c+(d-c)*u)-(a+(b-a)*u))*v)*1.45};
}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const wobN=makeNoise(777);

/* ---------- presets & defaults ---------- */
const DEF={grid:true,stream:true,contours:false,quiver:false,relief:false,marks:true,fill:false,tint:'checker',
  hmHeight:1,hmSmooth:2,noiseType:'smooth',noiseAmt:.28,noiseScale:1.8,windAngle:205,windStr:.95,swirl:1,spiral:.15,
  lineInk:0,lineWeight:1.3,spacing:18,levels:14,lineStyle:'broken',breaks:.35,arrowStyle:'none',arrowGap:150,arrowSize:6,lineLabels:false,labelGap:260,labelSize:13,labelTop:1200,
  trails:false,trailInk:3,trailDotInk:4,trailStyle:'dashdot',trailWeight:1.8,trailDash:16,trailDots:.5,trailSlope:1,
  rivers:false,riverInk:2,riverCount:0,riverValley:1,riverWidth:8,riverMeander:.8,riverTaper:.8,
  quiverInk:0,quiverCount:13,quiverLen:1.1,axes:true,
  gridInk:0,gridCells:16,gridWeight:1.1,gridDots:true,margin:.05,
  dotInk:1,dotCount:24,dotSize:28,ringInk:1,ringCount:10,ringSize:16,numInk:0,numCount:120,numSize:12,speckCount:50,
  tintInk:1,tintInk2:2,tintInk3:4,tintBands:3,tintOrder:'peaks',tintShift:-.3,tintOp:1,tintOp2:1,tintOp3:1,
  reliefInk:0,hatchInk:0,hatch:'cross',hatchGap:6,reliefHeight:.35,reliefTilt:.62,reliefLevels:14,flags:true,flagSize:20,
  misreg:1.5,grain:.45,bleed:.35,wobble:.5,inkDensity:.92,paperTex:.55,blotch:0};
const PRESETS={
  topo:{name:'Topo',paper:'#f5f8ec',inks:['#8b5a2b','#a6cd6a','#1e90e0','#c23a35','#1b1b1b'],

/* marching squares → chained polylines (grid coords) */

      case 4:case 11:seg(T,R);break;case 6:case 9:seg(T,B);break;case 7:case 8:seg(Lf,T);break;

  const free=(x,y,d,id,ix,skip)=>{const ci=(x-fr.x0)/cs|0,cj=(y-fr.y0)/cs|0,r=Math.ceil(d/cs),d2=d*d;
    for(let j=cj-r;j<=cj+r;j++){if(j<0||j>=rows)continue;for(let i=ci-r;i<=ci+r;i++){if(i<0||i>=cols)continue;const a=cells[j*cols+i];

  const r=mulberry32(5),n1=makeNoise(91),n2=makeNoise(17),n3=makeNoise(23);

function tintGeo(F){

function toCanvas(e){const r=ov.getBoundingClientRect();return [(e.clientX-r.left)/r.width*cv.width,(e.clientY-r.top)/r.height*cv.height]}

  $('#oPreset').innerHTML=Object.entries(PRESETS).map(([k,p])=>presetCard(k,p,'pcard')).join('');
  $('#oRecipe').innerHTML=Object.entries(RECIPES).map(([k,r])=>`<button class="ochip" data-k="${k}" aria-pressed="false">${r.name}</button>`).join('');
  const bind=(sel,key,attr)=>$(sel).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pick[key]=b.dataset[attr];syncSetup()});
  const sf=$('#fSetupHm');
  $('#oTerrain').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k==='random'){pick.hm=null;syncSetup()}else sf.click()});
  sf.addEventListener('change',()=>{const f=sf.files[0];sf.value='';if(f)readHeightmap(f,id=>{pick.hm=id;syncSetup()})});
  bind('#oSize','aspect','k');bind('#oPreset','preset','p');bind('#oRecipe','recipe','k');
  $('#sGo').onclick=()=>{S=freshState(pick.preset,pick.recipe,pick.aspect);if(pick.hm)useHeightmap(S,pick.hm);uid=Math.max(...S.feats.map(f=>f.id))+1;select(null);
    applyVars();syncAll();$('#setup').hidden=true;queue()};
  $('#sCancel').onclick=()=>$('#setup').hidden=true;
}
function syncSetup(){
  $('#oSize').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===pick.aspect));
  $('#oPreset').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===pick.preset));
  $('#oRecipe').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===pick.recipe));
  $('#oTerrain').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.k==='image')===!!pick.hm));
  $('#oTerrain [data-k=image]').textContent=pick.hm?'Heightmap loaded':'Heightmap';
}
function openSetup(first){
  const rk=S.mode||'currents';
  pick={aspect:S.aspect,preset:S.preset||'topo',recipe:rk,hm:null};syncSetup();$('#sCancel').hidden=!!first;$('#setup').hidden=false;
}

/* top bar */
$('#bShuffle').onclick=()=>{S.seed=Math.floor(rnd()*1e9);queue()};
$('#bNew').onclick=()=>openSetup(false);
function setPanel(open){
  const p=$('#panel'),app=$('#app'),dock=document.querySelector('.dock');p.hidden=!open;
  app.style.paddingBottom='';app.style.paddingRight='';dock.hidden=false;
  if(open){if(window.innerWidth>=900)app.style.paddingRight=(p.offsetWidth+16)+'px';else{app.style.paddingBottom=p.offsetHeight+'px';dock.hidden=true}}
  fit();
}
$('#bSettings').onclick=()=>setPanel($('#panel').hidden);
$('#bClose').onclick=()=>setPanel(false);
window.addEventListener('resize',()=>{if(!$('#panel').hidden)setPanel(true)});
$('#exClose').onclick=()=>{$('#exportView').hidden=true;$('#exImg').removeAttribute('src')};
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}
function closeX(){$('#xmenu').hidden=true}
$('#bExport').onclick=e=>{e.stopPropagation();$('#xmenu').hidden=!$('#xmenu').hidden};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#xmenu,#bExport'))closeX()});
$('#xSvg').onclick=async()=>{closeX();let svg;try{svg=buildSVG()}catch(err){toast('SVG export failed');return}
  const show=()=>{$('#exImg').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);$('#exCopy').hidden=false;$('#exCopy').onclick=async()=>{try{await navigator.clipboard.writeText(svg);toast('SVG copied')}catch(e){toast('Copy is not available here')}};$('#exportView').hidden=false};
  if(!DL){show();return}
  try{await DL.save({filename:'isobar-press.svg',data:svg});}catch(e){show()}};
$('#xPng').onclick=async()=>{closeX();
  const [W,H]=ASPECTS[S.aspect],sc=2,c=mk(W*sc,H*sc),pl=makePool(W*sc,H*sc);
  const prevK=K;render(c.getContext('2d'),W*sc,H*sc,pl);K=prevK;
  pl.lay.width=pl.rel.width=pl.small.width=0;
  const show=()=>{$('#exImg').src=c.toDataURL('image/png');$('#exCopy').hidden=true;$('#exportView').hidden=false};
  if(!DL){show();return}
  c.toBlob(async b=>{try{await DL.save({filename:'isobar-press.png',data:b});}catch(e){show()}},'image/png');
};
DL={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.svg')?'image/svg+xml':'application/octet-stream'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'}}};

/* boot */
load();applyVars();buildPanel();buildSetup();syncAll();
const [W0,H0]=ASPECTS[S.aspect];cv.width=W0;cv.height=H0;
doRender();commit();
if(firstRun)openSetup(true);
if(document.fonts){Promise.all(['600 20px "Archivo Narrow"','600 20px Oswald'].map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>queue())}
})();
</script>
</body>
</html>

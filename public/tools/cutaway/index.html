<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cutaway</title>

<style>
/* Layout: the artboard sits on a plain neutral stage; one tool rail below it; every fine control lives in a sheet a tap away */
:root{
  --mat:#e2e3df;
  --mat-minor:rgba(255,255,255,.07);
  --mat-major:rgba(255,255,255,.14);
  --surface:#f4f5f2;
  --raise:#ffffff;
  --line:#d9dcd6;
  --text:#1c1f1e;
  --muted:#66706b;
  --seg:#e6e8e3;
  --accent:#e0533f;
  --on-accent:#ffffff;
  --shadow:rgba(10,20,15,.28);
  --track:#eceeeb;
  --fill:#ffffff;
  --fill-edge:#e1e4df;
  --ok:#2ea44f;
  --on-ok:#ffffff;
  --btn-dark:#2b2e2d;
  --on-dark:#ffffff;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mat:#0e1110; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.1);
    --surface:#151817; --raise:#1e2221; --line:#2c3230; --text:#e8ebe8; --muted:#95a09a;
    --seg:#262b29; --accent:#ef6955; --on-accent:#1a0f0c; --shadow:rgba(0,0,0,.5);
    --track:#252a28; --fill:#3a403e; --fill-edge:#454c49; --ok:#38b25c; --on-ok:#ffffff; --btn-dark:#e8ebe8; --on-dark:#151817;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mat:#0e1110; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.1);
  --surface:#151817; --raise:#1e2221; --line:#2c3230; --text:#e8ebe8; --muted:#95a09a;
  --seg:#262b29; --accent:#ef6955; --on-accent:#1a0f0c; --shadow:rgba(0,0,0,.5);
  --track:#252a28; --fill:#3a403e; --fill-edge:#454c49; --ok:#38b25c; --on-ok:#ffffff; --btn-dark:#e8ebe8; --on-dark:#151817;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mat);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;transition:padding .2s ease}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface)}
header.bar{justify-content:space-between;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.12em;text-transform:uppercase}
.mark svg{display:block}

.btn{height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:600;font-size:14px}
.btn svg{width:20px;height:20px;flex:none}
.btn.icon{padding:0;width:44px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn .txt{display:none}
@media (min-width:560px){.btn .txt{display:inline}}

.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;padding-top:64px;padding-bottom:56px;box-sizing:border-box;
  background-color:var(--mat);}
.stage.drop{box-shadow:inset 0 0 0 3px var(--accent)}
#art{display:block;box-shadow:0 1px 2px var(--shadow),0 14px 40px var(--shadow);touch-action:manipulation;cursor:pointer}

.editor{position:absolute;z-index:6;box-sizing:border-box;border:2px solid var(--accent);border-radius:6px;padding:0 8px;outline:none;min-width:0}

.selbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px var(--shadow);z-index:7}
.selbar .btn{border:none;background:transparent;height:42px;min-width:42px}
.selbar .btn.danger{color:var(--accent)}
.selbar .sep{width:1px;background:var(--line);margin:6px 2px}

footer.bar{border-top:1px solid var(--line);padding-block:10px;flex-wrap:wrap}
footer .spacer{display:none}
@media (max-width:640px){footer .seg{order:-1;flex-basis:100%}footer .spacer{display:block;flex:1}.seg button{font-size:13px;letter-spacing:.01em}}
.seg{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:var(--seg);border-radius:12px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:0 1px 3px var(--shadow)}

.sheet{position:fixed;left:0;right:0;bottom:0;max-height:58%;background:var(--raise);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px var(--shadow);display:flex;flex-direction:column;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:860px){
  .sheet{left:auto;top:0;width:340px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
}
.sheet-head{display:flex;align-items:flex-start;gap:6px;padding:14px 8px 10px 16px}
.sheet-head .seg{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);flex:1;order:0;flex-basis:auto}
.sheet .seg button{font-size:15px;height:40px;letter-spacing:.06em}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.sheet-head .btn{border:none;background:transparent;flex:none}
.float{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:8}
.fab{background:var(--raise);border:1px solid var(--line);box-shadow:0 4px 14px var(--shadow)}
.fab.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.fab[aria-expanded="true"]{background:var(--text);color:var(--raise);border-color:transparent}
.sheet-body{overflow:auto;padding:0 20px 24px;display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:10px}
.group h3{margin:6px 0 4px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px}
.row > label,.row > span{font-size:14px;flex:none}
.row input[type=range]{flex:1;min-width:0;max-width:190px;accent-color:var(--accent);height:32px}
.row select,.row input[type=text]{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;width:150px;font-size:14px}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--seg);border:1px solid var(--line);position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--raise);box-shadow:0 1px 3px var(--shadow);transition:transform .15s}
.switch:checked{background:var(--accent);border-color:transparent}
.switch:checked::after{transform:translateX(18px)}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);padding:0;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raise),0 0 0 4px var(--accent)}
.sw.pair::after{content:"";position:absolute;right:0;bottom:0;width:50%;height:50%;background:var(--ink-swatch)}
input[type=color].sw{appearance:none;-webkit-appearance:none;cursor:pointer;background:none}
input[type=color].sw::-webkit-color-swatch-wrapper{padding:0}
input[type=color].sw::-webkit-color-swatch{border:none;border-radius:50%}
input[type=color].sw::-moz-color-swatch{border:none;border-radius:50%}
.reset{align-self:flex-start;margin-top:4px}
.row .btn{height:40px}
.row input.num{width:90px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.preview{position:fixed;inset:0;background:rgba(8,12,10,.86);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
.preview img{max-width:92%;max-height:84%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.preview .btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion: reduce){.app,.switch,.switch::after{transition:none}}
/* pill controls, modeled on a stepper card: grey track, white fill to the value, - and + at the ends */
.row.ctl{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;min-height:0}
.pill{position:relative;height:62px;border-radius:18px;background:var(--track);display:flex;align-items:center;overflow:hidden;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.pill:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pill-fill{position:absolute;left:3px;top:3px;bottom:3px;width:calc((100% - 6px) * var(--t,0));background:var(--fill);border:1px solid var(--fill-edge);box-sizing:border-box;border-radius:15px;box-shadow:0 1px 2px rgba(10,20,15,.06);transition:width .12s ease-out}
.pill.dragging .pill-fill{transition:none}
.pill-btn{position:relative;z-index:1;width:52px;height:100%;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--text);padding:0;cursor:pointer}
.pill-btn svg{width:22px;height:22px}
.pill-btn:disabled{opacity:.22;cursor:default}
.pill-mid{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:none;text-align:center;padding:0 4px}
.pill-val{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill-lab{font-size:12.5px;line-height:1.2;color:var(--muted)}
.pill-ends{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);padding:0 2px;font-variant-numeric:tabular-nums}
.pill.field{cursor:text;flex-direction:column;justify-content:center;gap:1px;padding:0 16px}
.row .pill.field input{width:100%;height:auto;border:0;background:transparent;padding:0;text-align:center;font-size:21px;font-weight:600;line-height:1.15;outline:none;color:var(--text)}
.row .pill.field input::placeholder{color:var(--muted);opacity:.7}
.vh{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;opacity:0;margin:0;padding:0;border:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:8px 14px 8px 18px;box-sizing:border-box;border-radius:18px;background:var(--track);cursor:pointer;user-select:none;-webkit-user-select:none}
.toggle:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.t-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.t-title{font-size:16px;font-weight:600;line-height:1.2}
.t-sub{font-size:12.5px;color:var(--muted)}
.badge{width:46px;height:32px;border-radius:7px;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);flex:none;box-sizing:border-box;transition:background .15s,border-color .15s,color .15s}
.badge svg{width:22px;height:22px}
.toggle.on .badge{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.row.switchrow{min-height:62px;padding:8px 12px 8px 18px;box-sizing:border-box;border-radius:18px;background:var(--track)}
.row.switchrow > label{font-size:16px;font-weight:600}
.row.switchrow select,.row.switchrow input[type=text]{background:var(--fill);border-color:var(--fill-edge);height:40px}
.row.switchrow .switch{background:var(--fill-edge);border-color:transparent}
.row.switchrow .switch:checked{background:var(--accent)}
.row.colorcard{min-height:62px;padding:8px 14px 8px 18px;box-sizing:border-box;border-radius:18px;background:var(--track)}
.row.colorcard > span{font-size:16px;font-weight:600}
.row.colorcard .sw{box-shadow:0 0 0 2px var(--track);width:28px;height:28px}
.row.colorcard .swatches{gap:6px;flex-wrap:nowrap;min-width:0}
.row.colorcard{gap:10px}
.row.colorcard .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--track),0 0 0 4px var(--accent)}
.bigbtn{width:100%;min-height:58px;border-radius:18px;border:0;background:var(--track);color:var(--text);font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 16px;box-sizing:border-box}
.bigbtn.dark{background:var(--btn-dark);color:var(--on-dark)}
.bigbtn .bb-sub{font-size:12.5px;font-weight:400;color:var(--muted)}
.reset.bigbtn{margin-top:0}
@media (prefers-reduced-motion: reduce){.pill-fill,.badge{transition:none}}

</style>

</head>
<body>
<div class="app" id="app">

  <main class="stage" id="stage">
    <canvas id="art" aria-label="Chart preview"></canvas>
    <input class="editor" id="editor" type="text" autocomplete="off" spellcheck="false" hidden>
    <div class="selbar" id="selbar" hidden>
      <button class="btn icon" id="selLeft" aria-label="Move left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="btn icon" id="selRight" aria-label="Move right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="btn icon" id="selImg" aria-label="Replace this item's image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg></button>
      <button class="btn icon" id="selDup" aria-label="Duplicate item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button class="btn icon danger" id="selDel" aria-label="Delete item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
      <span class="sep"></span>
      <button class="btn icon" id="selDone" aria-label="Done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></button>
    </div>
    <div class="float" id="floatBar">
      <button class="btn icon fab" id="gearBtn" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="btn icon fab primary" id="saveBtn" aria-label="Save image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></button>
    </div>
  </main>

</div>

<aside class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <div class="seg" role="group" aria-label="Chart style">
      <button data-mode="slice" aria-pressed="true">Slice</button>
      <button data-mode="strip" aria-pressed="false">Strip</button>
      <button data-mode="bars" aria-pressed="false">Bars</button>
      <button data-mode="portion" aria-pressed="false">Portion</button>
      <button data-mode="pie" aria-pressed="false">Pie</button>
      <button data-mode="wave" aria-pressed="false">Wave</button>
    </div>
    <button class="btn icon" id="sheetClose" aria-label="Close settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="group">
      <h3>Data</h3>
      <button class="bigbtn dark" id="imgBtn">Choose image</button>
      <button class="bigbtn" id="csvBtn">Import CSV</button>
      <button class="bigbtn" id="addBtn">Add item</button>
      <div class="row" id="poolRow" data-only="bars portion"><span id="poolCount">1 image</span><button class="btn" id="shuffleBtn">Shuffle images</button></div>
    </div>
    <div class="group">
      <h3>Image</h3>
      <div class="row"><label for="s-cutout">Cut out background</label><input class="switch" type="checkbox" id="s-cutout" data-k="cutout"></div>
      <div class="row"><label for="s-tol">Cutout tolerance</label><input type="range" id="s-tol" data-k="tol" min="4" max="90" step="1"></div>
    </div>
    <div class="group">
      <h3>Layout</h3>
      <div class="row"><label for="s-format">Format</label><select id="s-format" data-k="format"><option value="auto">Auto</option><option value="wide">Wide 16:9</option><option value="square">Square</option><option value="portrait">Portrait 4:5</option><option value="story">Story 9:16</option></select></div>
      <div class="row"><label for="s-order">Order</label><select id="s-order" data-k="order"><option value="none">As entered</option><option value="desc">Largest first</option><option value="asc">Smallest first</option></select></div>
      <div class="row" data-only="bars"><label for="s-dir">Direction</label><select id="s-dir" data-k="dir"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></div>
      <div class="row" data-only="bars"><label for="s-fill">Bar fill</label><select id="s-fill" data-k="fill"><option value="stretch">One per bar</option><option value="stack">Stacked</option></select></div>
      <div class="row" data-only="bars" data-fill="stretch"><label for="s-barFit">Shorter bars</label><select id="s-barFit" data-k="barFit"><option value="scale">Scale down</option><option value="crop">Crop</option></select></div>
      <div class="row" data-only="bars" data-fill="stack"><label for="s-unit">Each image equals</label><input type="text" class="num" id="s-unit" data-k="unit" inputmode="decimal" placeholder="Auto"></div>
      <div class="row" data-only="wave"><label for="s-waveStyle">Wave style</label><select id="s-waveStyle" data-k="waveStyle"><option value="stretch">Waveform</option><option value="shift">Line</option></select></div>
      <div class="row" data-only="wave"><label for="s-amp">Wave height</label><input type="range" id="s-amp" data-k="amp" min="0.6" max="4" step="0.05"></div>
      <div class="row" data-only="wave"><label for="s-ends">Uncut ends</label><input type="range" id="s-ends" data-k="ends" min="0" max="40" step="1"></div>
      <div class="row" data-only="slice strip portion bars wave"><label for="s-gap">Spacing</label><input type="range" id="s-gap" data-k="gap" min="0" max="120" step="1"></div>

/* ---------- images ---------- */
const imgs = new Map(); // id -> { raw, proc }
let rowCounter = 0;

function toCanvas(im, max) {
  const w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height;
  const sc = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * sc)); c.height = Math.max(1, Math.round(h0 * sc));
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c;
}
function fileToCanvas(file, max) {
  return new Promise((res, rej) => {

    im.onload = () => { const c = toCanvas(im, max); URL.revokeObjectURL(url); res(c); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file could not be opened as an image. Try a JPG or PNG.')); };
    im.src = url;

}

function floodCut(d, w, h, tol) {
  let r = 0, g = 0, b = 0, n = 0;
  const pts = [];
  const step = Math.max(1, Math.floor(Math.max(w, h) / 300));
  for (let x = 0; x < w; x += step) { pts.push(x, (h - 1) * w + x); }
  for (let y = 0; y < h; y += step) { pts.push(y * w, y * w + w - 1); }
  for (const p of pts) { const i = p * 4; r += d[i]; g += d[i+1]; b += d[i+2]; n++; }

  let near = 0; for (const p of pts) if (dist2(p) <= thr2) near++;
  if (near / pts.length < 0.45) return false; // border is not a plain background
  const N = w * h, mark = new Uint8Array(N), stack = new Int32Array(N);
  let sp = 0;
  const push = p => { if (!mark[p] && dist2(p) <= thr2) { mark[p] = 1; stack[sp++] = p; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const p = stack[--sp], x = p % w;
    if (x > 0) push(p - 1);
    if (x < w - 1) push(p + 1);
    if (p >= w) push(p - w);
    if (p < N - w) push(p + w);
  }
  for (let p = 0; p < N; p++) if (mark[p]) d[p*4+3] = 0;
  for (let p = 0; p < N; p++) {
    if (mark[p]) continue;
    const x = p % w;
    if ((x > 0 && mark[p-1]) || (x < w-1 && mark[p+1]) || (p >= w && mark[p-w]) || (p < N-w && mark[p+w])) {
      const t = Math.min(1, Math.sqrt(dist2(p)) / (thr * 1.8));
      d[p*4+3] = Math.round(d[p*4+3] * Math.max(0.2, t));
    }
  }
  return true;
}

function processRaw(raw) {
  const w = raw.width, h = raw.height;
  const src = raw.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h);
  const d = new Uint8ClampedArray(src.data);
  const a = (x, y) => d[(y * w + x) * 4 + 3];
  const hasAlpha = a(0,0) < 20 || a(w-1,0) < 20 || a(0,h-1) < 20 || a(w-1,h-1) < 20;

  const cx = c.getContext('2d', { willReadFrequently: true });

    for (let y = 0; y < bh; y++) if (td[(y*bw+x)*4+3] > 60) { top[x] = y; break; }
    for (let y = bh - 1; y >= 0; y--) if (td[(y*bw+x)*4+3] > 60) { bot[x] = y; break; }
  }

}

function makePencil() {
  const c = document.createElement('canvas'); c.width = 1320; c.height = 220;
  const x = c.getContext('2d');
  const tipX = 8, coneX = 212, ferX = 1130, eraX = 1214, endX = 1310, y0 = 30, y1 = 190, mid = 110, b1 = 82, b2 = 138;
  // wood cone
  const wg = x.createLinearGradient(0, y0, 0, y1); wg.addColorStop(0, '#f0d3a6'); wg.addColorStop(1, '#cf9f62');
  x.fillStyle = wg; x.beginPath(); x.moveTo(tipX, mid); x.lineTo(coneX + 20, y0 + 2); x.lineTo(coneX + 20, y1 - 2); x.closePath(); x.fill();
  // graphite
  const gh = 70 * (y1 - mid) / (coneX + 20 - tipX);
  x.fillStyle = '#34363a'; x.beginPath(); x.moveTo(tipX, mid); x.lineTo(tipX + 70, mid - gh); x.lineTo(tipX + 70, mid + gh); x.closePath(); x.fill();
  x.fillStyle = 'rgba(255,255,255,.18)'; x.beginPath(); x.moveTo(tipX + 6, mid - 2); x.lineTo(tipX + 66, mid - gh + 4); x.lineTo(tipX + 66, mid - gh + 10); x.closePath(); x.fill();

  x.quadraticCurveTo(coneX - 44, (y0 + b1) / 2, coneX, b1);
  x.quadraticCurveTo(coneX - 44, (b1 + b2) / 2, coneX, b2);
  x.quadraticCurveTo(coneX - 44, (b2 + y1) / 2, coneX, y1);
  x.lineTo(ferX + 4, y1); x.closePath(); x.clip();
  [[y0, b1, '#f8cd4c'], [b1, b2, '#f1b62c'], [b2, y1, '#d99a1f']].forEach(([a, b, col]) => { x.fillStyle = col; x.fillRect(0, a, ferX + 10, b - a); });
  x.fillStyle = 'rgba(255,255,255,.4)'; x.fillRect(0, 44, ferX + 10, 6);
  x.fillStyle = 'rgba(0,0,0,.09)'; x.fillRect(0, b1 - 1, ferX + 10, 2); x.fillRect(0, b2 - 1, ferX + 10, 2);
  x.fillStyle = 'rgba(40,52,40,.55)'; x.font = 'bold 30px "Barlow Condensed","Arial Narrow",sans-serif'; x.textBaseline = 'middle';
  x.fillText('No. 2  ·  HB', 860, mid + 1);
  x.restore();
  // ferrule
  const fg = x.createLinearGradient(0, y0 - 6, 0, y1 + 6);
  fg.addColorStop(0, '#e2e5e7'); fg.addColorStop(0.35, '#b9bec3'); fg.addColorStop(0.7, '#8f959b'); fg.addColorStop(1, '#c2c6ca');
  x.fillStyle = fg; x.fillRect(ferX, y0 - 6, eraX - ferX, y1 - y0 + 12);
  x.fillStyle = 'rgba(0,0,0,.18)';
  for (const fx of [ferX + 14, ferX + 22, eraX - 22, eraX - 14]) x.fillRect(fx, y0 - 6, 3, y1 - y0 + 12);
  // eraser
  const eg = x.createLinearGradient(0, y0, 0, y1); eg.addColorStop(0, '#f6a7b1'); eg.addColorStop(1, '#d9707f');
  x.fillStyle = eg; x.beginPath();
  const rr = 26; x.moveTo(eraX, y0 + 2); x.lineTo(endX - rr, y0 + 2); x.quadraticCurveTo(endX, y0 + 2, endX, y0 + 2 + rr);
  x.lineTo(endX, y1 - 2 - rr); x.quadraticCurveTo(endX, y1 - 2, endX - rr, y1 - 2); x.lineTo(eraX, y1 - 2); x.closePath(); x.fill();

}

/* ---------- drawing helpers ---------- */
function F(size, bold) { const f = FONTS[S.s.font] || FONTS.condensed; return `${bold ? f.bold : f.reg} ${size}px ${f.fam}`; }
function wrap(ctx, text, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean);
  if (!words.length) return [''];
  const lines = []; let cur = words[0];
  for (let i = 1; i < words.length; i++) {
    const t = cur + ' ' + words[i];
    if (ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = words[i]; }
  }
  lines.push(cur); return lines;
}
function measureLines(ctx, lines) { let w = 0; for (const l of lines) w = Math.max(w, ctx.measureText(l).width); return w; }
function blockH(size, n) { return size * 1.1 * (n - 1) + size; }
function drawLines(ctx, lines, x, y, size, bold, align, alpha, hit, hits) {
  ctx.font = F(size, bold); ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = S.s.ink; ctx.globalAlpha = alpha;
  let w = 0;
  lines.forEach((l, i) => { ctx.fillText(l, x, y + i * size * 1.1); w = Math.max(w, ctx.measureText(l).width); });
  ctx.globalAlpha = 1;
  const h = blockH(size, lines.length);
  const hw = Math.max(w, size * 1.6);
  const bx = align === 'left' ? x : align === 'right' ? x - hw : x - hw / 2;
  if (hit && hits) hits.push(Object.assign({ x: bx, y, w: hw, h, size, bold, align }, hit));
  return { x: bx, y, w: hw, h };
}
function fmt(v) {
  const n = Number(v) || 0;
  return S.prefix + n.toLocaleString('en-US', { maximumFractionDigits: 2 }) + S.suffix;
}
function view() {
  const v = S.items.map((it, i) => ({ it, i }));
  if (S.s.order === 'desc') v.sort((a, b) => b.it.value - a.it.value);
  else if (S.s.order === 'asc') v.sort((a, b) => a.it.value - b.it.value);
  return v;
}
function overlaps(r, list, pad) {
  return list.some(q => r.x < q.x + q.w + pad && r.x + r.w + pad > q.x && r.y < q.y + q.h + pad && r.y + r.h + pad > q.y);
}
function arrowDown(ctx, x, y, s) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s * 0.55, y - s); ctx.lineTo(x + s * 0.55, y - s); ctx.closePath(); ctx.fill(); }

/* ---------- main render ---------- */
function draw(ctx, W, H, out) {
  const hits = out ? out.hits : null, shapes = out ? out.shapes : null;
  ctx.fillStyle = S.s.paper; ctx.fillRect(0, 0, W, H);
  const g = Math.min(W, H) / 1000;
  const u = g * S.s.textScale;
  const M = Math.round(Math.min(W, H) * 0.07);
  let top = M, bottom = H - M;
  if (S.s.showTitle) {
    ctx.font = F(56 * u, true);
    const r = drawLines(ctx, wrap(ctx, S.title, W - 2 * M), M, top, 56 * u, true, 'left', 1, { type: 'title' }, hits);
    top += r.h + 14 * u;
    ctx.font = F(28 * u, false);
    const r2 = drawLines(ctx, wrap(ctx, S.subtitle, Math.min(W - 2 * M, 1100 * u)), M, top, 28 * u, false, 'left', 0.62, { type: 'subtitle' }, hits);
    top += r2.h + 44 * u;
  }
  if (S.s.showSource) {
    bottom -= 22 * u;
    drawLines(ctx, [S.source], M, bottom, 22 * u, false, 'left', 0.5, { type: 'source' }, hits);
    bottom -= 30 * u;
  }
  const box = { x: M, y: top, w: W - 2 * M, h: Math.max(40, bottom - top) };
  if (!imgOf('main')) return;
  const fn = { slice: drawRow, strip: drawRow, portion: drawPortion, pie: drawPie, wave: drawWave, bars: drawBars }[S.mode];
  fn(ctx, box, u, g, hits, shapes);

function drawPie(ctx, box, u, g, hits, shapes) {
  const V = view(), n = V.length; if (!n) return;

  const vals = V.map(o => Math.max(0, Number(o.it.value) || 0));

  for (const w of wedges) {

    }

    if (shapes) shapes[w.o.i] = shape;

  }
  const vS = 44 * u, nS = 24 * u;
  const labels = wedges.map(w => {
    const side = Math.cos(w.mid) >= 0 ? 1 : -1;
    ctx.font = F(nS, false); const lines = wrap(ctx, w.o.it.label, labelRoom - 50 * u);
    const h = vS + 4 * u + blockH(nS, lines.length);
    const ay = cy + Math.sin(w.mid) * (R + ex + 30 * u);

  for (const side of [1, -1]) {
    const L = labels.filter(l => l.side === side).sort((a, b) => a.y - b.y);
    for (let i = 1; i < L.length; i++) L[i].y = Math.max(L[i].y, L[i-1].y + L[i-1].h + 12 * u);

      for (let i = 0; i < L.length; i++) L[i].y = Math.max(L[i].y, i ? L[i-1].y + L[i-1].h + 12 * u : box.y);
    }

    drawLines(ctx, [fmt(w.o.it.value)], lx, l.y, vS, true, al, 1, { type: 'value', idx: w.o.i }, hits);
    drawLines(ctx, l.lines, lx, l.y + vS + 4 * u, nS, false, al, 0.72, { type: 'label', idx: w.o.i }, hits);
  }
}

    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
    const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); x.imageSmoothingQuality = 'high';
    draw(x, W, H, null);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const name = (slug(S.title) || 'cutaway') + '.png';
    if (window.claude && typeof window.claude.use === 'function') {
      let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) {}
      if (dl) {
        try { await dl.save({ filename: name, data: blob }); toast('Saved'); }
        catch (e) { if (e && e.code === 'declined') {} else if (e && e.code === 'rate_limited') toast('A save is already waiting for you'); else showPreview(blob); }
      } else showPreview(blob);
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('Saved');
    }
  } finally { busy = false; }
};

/* ---------- settings sheet ---------- */
const sheet = $('sheet'), app = $('app');
function layoutForSheet() {
  const open = !sheet.hidden, wide = window.matchMedia('(min-width: 860px)').matches;
  app.style.paddingRight = open && wide ? '340px' : '';
  app.style.paddingBottom = open && !wide ? sheet.offsetHeight + 'px' : '';
}
function setSheet(open) { sheet.hidden = !open; $('gearBtn').setAttribute('aria-expanded', String(open)); layoutForSheet(); }
$('gearBtn').onclick = () => setSheet(sheet.hidden);
$('sheetClose').onclick = () => setSheet(false);
window.addEventListener('resize', layoutForSheet);

function buildSwatches() {
  const ps = $('paperSw'); ps.innerHTML = '';
  PAPERS.forEach(([p, i]) => {
    const b = document.createElement('button'); b.className = 'sw pair'; b.style.background = p; b.style.setProperty('--ink-swatch', i);
    b.setAttribute('aria-label', 'Paper ' + p); b.dataset.paper = p;
    b.onclick = () => { S.s.paper = p; S.s.ink = i; persist(); syncPanel(); render(); };
    ps.append(b);
  });
  const pc = document.createElement('input'); pc.type = 'color'; pc.className = 'sw'; pc.id = 's-paper'; pc.dataset.k = 'paper'; pc.setAttribute('aria-label', 'Custom paper color');
  ps.append(pc);
  const as = $('accentSw'); as.innerHTML = '';
  ACCENTS.forEach(c => {
    const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.dataset.accent = c; b.setAttribute('aria-label', 'Accent ' + c);
    b.onclick = () => { S.s.accent = c; persist(); syncPanel(); render(); };
    as.append(b);
  });
  const ac = document.createElement('input'); ac.type = 'color'; ac.className = 'sw'; ac.id = 's-accent'; ac.dataset.k = 'accent'; ac.setAttribute('aria-label', 'Custom accent color');
  as.append(ac);
}
function syncPanel() {
  document.querySelectorAll('[data-k]').forEach(el => {
    const v = S.s[el.dataset.k];
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  });
  document.querySelectorAll('[data-r]').forEach(el => { el.value = S[el.dataset.r]; });
  document.querySelectorAll('[data-paper]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.paper.toLowerCase() === S.s.paper.toLowerCase())));
  document.querySelectorAll('[data-accent]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.accent.toLowerCase() === S.s.accent.toLowerCase())));
  document.querySelectorAll('[data-only]').forEach(el => { el.hidden = !el.dataset.only.split(' ').includes(S.mode) || (el.dataset.fill && el.dataset.fill !== S.s.fill); });
  const np = livePool().length;
  $('poolCount').textContent = np + (np === 1 ? ' image' : ' images');
  if (np < 2) $('poolRow').hidden = true;
  if (S.mode === 'bars' && S.s.fill !== 'stack') $('s-gap').closest('.row').hidden = true;
  refreshCtls();
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
}
function onSetting(e) {
  const el = e.target;
  if (el.dataset.k) {
    const k = el.dataset.k;
    S.s[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? Number(el.value) : el.value;
    persist();
    if (k === 'cutout' || k === 'tol') { reprocessAll(); return; }
    if (k === 'format' || k === 'dir') { fit(); return; }
    if (k === 'fill') syncPanel();
    if (k === 'font') { syncPanel(); loadFont().then(render); }
    if (k === 'paper' || k === 'accent') syncPanel();
    render();
  } else if (el.dataset.r) {
    S[el.dataset.r] = el.value; touched(); persist(); render();
  }
}
sheet.addEventListener('input', onSetting);
sheet.addEventListener('change', onSetting);
$('resetBtn').onclick = () => {
  const cut = S.s.cutout !== DEFAULTS.s.cutout || S.s.tol !== DEFAULTS.s.tol;
  const seed = S.s.seed; S.s = clone(DEFAULTS.s); S.s.seed = seed; persist(); syncPanel();
  loadFont().then(() => { if (cut) reprocessAll(); fit(); });
};

/* ---------- pill controls ---------- */
const CTL = {
  tol: { f: v => String(Math.round(v)), lo: 'Tight', hi: 'Loose', b: 4 },
  gap: { f: v => String(Math.round(v)), lo: 'Touching', hi: 'Wide', b: 6 },
  explode: { f: v => String(Math.round(v)), lo: 'Closed', hi: 'Apart', b: 5 },
  turn: { f: v => Math.round(v) + '°', b: 15 },
  textScale: { f: v => Math.round(v * 100) + '%', b: 0.1 },
  amp: { f: v => (+v).toFixed(1) + '×', b: 0.2 },
  ends: { f: v => Math.round(v) + '%', b: 2 }
};
const ICON_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>';
const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m8.4 12.3 2.5 2.5 4.7-5.1"/></svg>';
const ctls = [];
function refreshCtls() { for (const c of ctls) c(); }
function mk(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function bindHold(btn, fn) {
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => {
    if (e.button) return; e.preventDefault(); stop();
    if (fn() === false) return;
    t1 = setTimeout(() => { t2 = setInterval(() => { if (fn() === false) stop(); }, 70); }, 380);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
}
function bindDrag(pill, onT, onEnd) {
  let st = null;
  const tAt = x => { const r = pill.getBoundingClientRect(); return clamp((x - r.left - 3) / Math.max(1, r.width - 6), 0, 1); };
  pill.addEventListener('pointerdown', e => {
    if (e.button || e.target.closest('.pill-btn')) return;
    st = { id: e.pointerId, x: e.clientX, y: e.clientY, on: e.pointerType === 'mouse' };
    if (st.on) { pill.setPointerCapture(e.pointerId); pill.classList.add('dragging'); onT(tAt(e.clientX)); }
  });
  pill.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    if (!st.on) {
      if (Math.abs(e.clientX - st.x) > 6 && Math.abs(e.clientX - st.x) > Math.abs(e.clientY - st.y)) { st.on = true; try { pill.setPointerCapture(e.pointerId); } catch (_) {} pill.classList.add('dragging'); }
      else if (Math.abs(e.clientY - st.y) > 8) { st = null; return; }
      else return;
    }
    onT(tAt(e.clientX));
  });
  pill.addEventListener('pointerup', e => {
    if (!st || e.pointerId !== st.id) return;
    if (!st.on) onT(tAt(e.clientX));
    st = null; pill.classList.remove('dragging'); if (onEnd) onEnd();
  });
  pill.addEventListener('pointercancel', () => { st = null; pill.classList.remove('dragging'); });
}
function buildPill(row, hidden, name, ends) {
  row.classList.add('ctl'); row.textContent = '';
  const pill = mk('div', 'pill'), fill = mk('div', 'pill-fill');
  const minus = mk('button', 'pill-btn', ICON_MINUS), plus = mk('button', 'pill-btn', ICON_PLUS);
  minus.type = plus.type = 'button';
  minus.setAttribute('aria-label', 'Less ' + name.toLowerCase());
  plus.setAttribute('aria-label', 'More ' + name.toLowerCase());
  const mid = mk('div', 'pill-mid'), val = mk('span', 'pill-val'), lab = mk('span', 'pill-lab');
  lab.textContent = name; mid.append(val, lab);
  hidden.classList.add('vh'); hidden.tabIndex = -1; hidden.setAttribute('aria-hidden', 'true');
  pill.append(fill, minus, mid, plus, hidden);
  const endsEl = mk('div', 'pill-ends'), a = mk('span'), b = mk('span');
  a.textContent = ends[0]; b.textContent = ends[1]; endsEl.append(a, b);
  row.append(pill, endsEl);
  return { pill, minus, plus, val };
}
function enhanceRange(row, input) {
  const cfg = CTL[input.dataset.k] || {}, f = cfg.f || (v => String(v));
  const min = +input.min, max = +input.max, step = +input.step || 1, by = cfg.b || step;
  const name = (row.querySelector('label') || {}).textContent || '';
  const snap = v => +((Math.round((clamp(v, min, max) - min) / step) * step) + min).toFixed(4);
  const set = v => { v = snap(v); if (v === +input.value) return false; input.value = v; input.dispatchEvent(new Event('input', { bubbles: true })); return true; };
  const ui = buildPill(row, input, name, [cfg.lo ?? f(min), cfg.hi ?? f(max)]);
  bindHold(ui.minus, () => set(+input.value - by) && +input.value > min);
  bindHold(ui.plus, () => set(+input.value + by) && +input.value < max);
  bindDrag(ui.pill, t => set(min + t * (max - min)), () => input.dispatchEvent(new Event('change', { bubbles: true })));
  ctls.push(() => {
    const v = +input.value;
    const tt = (v - min) / (max - min || 1);
    ui.pill.style.setProperty('--t', String(tt));
    ui.pill.firstChild.style.visibility = tt <= 0.001 ? 'hidden' : '';
    ui.val.textContent = f(v); ui.minus.disabled = v <= min; ui.plus.disabled = v >= max;
  });
}
function enhanceSelect(row, sel) {
  const name = (row.querySelector('label') || {}).textContent || '';
  const opts = [...sel.options], n = opts.length;
  const setI = i => { i = clamp(i, 0, n - 1); if (i === sel.selectedIndex) return false; sel.selectedIndex = i; sel.dispatchEvent(new Event('change', { bubbles: true })); return true; };
  const ui = buildPill(row, sel, name, [opts[0].text, opts[n - 1].text]);
  ui.minus.addEventListener('click', () => setI(sel.selectedIndex - 1));
  ui.plus.addEventListener('click', () => setI(sel.selectedIndex + 1));
  bindDrag(ui.pill, t => setI(Math.round(t * (n - 1))));
  ctls.push(() => {
    const i = Math.max(0, sel.selectedIndex);
    ui.pill.style.setProperty('--t', String(n > 1 ? i / (n - 1) : 1));
    ui.val.textContent = opts[i] ? opts[i].text : ''; ui.minus.disabled = i <= 0; ui.plus.disabled = i >= n - 1;
  });
}
function enhanceText(row, input) {
  const name = (row.querySelector('label') || {}).textContent || '';
  row.classList.add('ctl'); row.textContent = '';
  const pill = mk('label', 'pill field'), lab = mk('span', 'pill-lab');
  lab.textContent = name; pill.append(input, lab); row.append(pill);
}
function enhanceSwitch(row, input) {
  const name = (row.querySelector('label') || {}).textContent || '';
  row.classList.add('ctl'); row.textContent = '';
  const card = mk('label', 'toggle'), txt = mk('span', 't-text'), title = mk('span', 't-title'), sub = mk('span', 't-sub');
  title.textContent = name; txt.append(title, sub);
  input.classList.remove('switch'); input.classList.add('vh');
  card.append(txt, input, mk('span', 'badge', ICON_CHECK)); row.append(card);
  ctls.push(() => { card.classList.toggle('on', input.checked); sub.textContent = input.checked ? 'On' : 'Off'; });
}
function enhanceControls() {
  sheet.querySelectorAll('.row').forEach(row => {
    const r = row.querySelector('input[type=range]'), s = row.querySelector('select'), t = row.querySelector('input[type=text]'), c = row.querySelector('input[type=checkbox]');
    if (r) enhanceRange(row, r); else if (s || t || c) row.classList.add('switchrow');
    else if (row.querySelector('.swatches')) row.classList.add('colorcard');
  });
  const sh = $('shuffleBtn'), cnt = $('poolCount'), poolRow = $('poolRow');
  sh.className = 'bigbtn'; sh.textContent = ''; const shT = mk('span'); shT.textContent = 'Shuffle images';
  cnt.className = 'bb-sub'; sh.append(shT, cnt); poolRow.textContent = ''; poolRow.classList.add('ctl'); poolRow.append(sh);
  $('resetBtn').className = 'bigbtn reset';
  sheet.addEventListener('input', refreshCtls);
  sheet.addEventListener('change', refreshCtls);
}
enhanceControls();

/* ---------- boot ---------- */
function loadFont() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const f = FONTS[S.s.font] || FONTS.condensed;
  const t = new Promise(r => setTimeout(r, 2500));
  return Promise.race([Promise.all([document.fonts.load(`${f.reg} 30px ${f.fam}`), document.fonts.load(`${f.bold} 30px ${f.fam}`)]).catch(() => {}), t]);
}
buildSwatches();
syncPanel();
function boot(raw) { setImage('main', raw); fit(); }
let stored = null; try { stored = localStorage.getItem(IMGKEY); } catch (e) {}
if (stored) {
  const im = new Image();
  im.onload = () => boot(toCanvas(im, 1600));
  im.onerror = () => boot(makePencil());
  im.src = stored;
} else boot(makePencil());
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('700 30px "Barlow Condensed"'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
Promise.all([fontsReady, loadFont()]).then(() => {
  if (!stored && imgs.has('main') && !imgs.get('main').custom) setImage('main', makePencil());
  render();
});
})();
</script>

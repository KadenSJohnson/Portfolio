/* Layout: dark tool shell — panel of collapsible control cards (left on wide screens, bottom sheet on phones), canvas stage, action bar under the canvas */
:root {

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 13px;

#app { height: 100%; display: flex; gap: 16px; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-block: 12px; position: relative; }
#stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }

.bar { display: flex; gap: 6px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

.btn.danger { color: var(--danger); }

#panel { width: 340px; flex: none; margin-block: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; z-index: 20; min-height: 0; }

.pbody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 6px 8px 12px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 899px) {
  #panel { position: fixed; left: 0; right: 0; bottom: 0; width: auto; margin: 0; max-height: 64%; border-radius: 18px 18px 0 0; border-bottom: 0;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.card { background: var(--card); border-radius: 14px; padding: 0 14px 12px; }
.hd { width: 100%; height: 46px; display: flex; align-items: center; justify-content: space-between; border: 0; background: transparent; padding: 0; font-size: 13px; font-weight: 500; }

.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }

#addsheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; z-index: 25; display: flex; flex-direction: column; }

.upload { position: relative; overflow: hidden; }

.busy { font-size: 12px; color: var(--muted); text-align: center; }

/* overlays */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; width: min(440px, 100%); max-height: 100%; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

html.as-card body { background: #f3f3f3; padding: 0; }

  style: [['handles', 'Handles'], ['knot', 'Knot'], ['diecut', 'Die-cut']],
  hang: [['1', 'Hanging'], ['0', 'Floor']],
};
let draft = {};
function renderSetup() {
  for (const el of $$('[data-chips]')) {
    const k = el.dataset.chips; el.innerHTML = '';
    for (const [v, label] of CHIPS[k]) {
      const b = document.createElement('button'); b.textContent = label;
      b.setAttribute('aria-pressed', String(String(k === 'hang' ? (draft.hang ? 1 : 0) : draft[k]) === v));
      b.onclick = () => { draft[k] = k === 'hang' ? v === '1' : v; renderSetup(); };
      el.append(b);
    }
  }
  $('#setupFill').value = draft.fill;
  renderPresets($('#setupPresets'), draft, renderSetup);
}
$('#setupFill').addEventListener('input', e => { draft.fill = e.target.value; });
function openSetup() { draft = { aspect: S.aspect, style: S.style, hang: S.hang, fill: S.fill, bg: S.bg, bagColor: S.bagColor }; renderSetup(); $('#setup').hidden = false; }
$('#start').onclick = () => {
  Object.assign(S, draft); S.setupDone = true; save(); $('#setup').hidden = true; hookAnim = null;
  buildWorld(S.fill); syncUI();
};
$('#newCanvas').onclick = () => { setPanel(false); openSetup(); };

/* ---------- boot ---------- */
makeGrain(); syncUI(); buildWorld(S.fill);
if (!S.setupDone && !EMBED && !CARD) openSetup();
if (!CARD && matchMedia('(min-width: 900px)').matches) setPanel(true);
try { document.fonts && document.fonts.load('italic 400 40px Newsreader'); } catch (e) {}
requestAnimationFrame(frame);
})();
</script>

</body></html>
